<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Marquee: back to your TV</title>
<style>body{font-family:system-ui,sans-serif;background:#0E0B08;color:#F6EFE3;margin:0;padding:32px 20px;line-height:1.5;font-size:18px}a{color:#F5B83D}</style></head>
<body><h1 style="color:#F5B83D;letter-spacing:.1em">MARQUEE</h1><p id="msg">Sending your MyAnimeList sign-in to your TV…</p>
<script>
// MyAnimeList sends the phone here after sign-in with ?code=…&state=…
// The TV makes state as "<tv address>.<one-time token>", e.g. "192.168.1.64:8765.Ab3dE…".
// This page only forwards to that address, and only to a private home-network address.
// Nothing is stored or sent anywhere else.
const q = new URLSearchParams(location.search), code = q.get("code"), state = q.get("state") || "", msg = document.getElementById("msg");
const m = state.match(/^((?:10|127|192\.168|172\.(?:1[6-9]|2\d|3[01]))(?:\.\d{1,3}){1,3}):(\d{2,5})\.([A-Za-z0-9_-]{8,})$/);
if (q.get("error")) {
  msg.textContent = "Sign-in was cancelled. You can close this page.";
} else if (!code || !m) {
  msg.textContent = "This link is incomplete. Scan the code on your TV again.";
} else {
  const target = "http://" + m[1] + ":" + m[2] + "/mal?code=" + encodeURIComponent(code) + "&state=" + encodeURIComponent(state);
  msg.innerHTML = 'If nothing happens, <a href="' + target + '">tap here</a>. Your phone must be on the same Wi-Fi as the TV.';
  location.replace(target);
}
</script></body></html>
